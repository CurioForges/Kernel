name: Publish release to mirrors

# 本仓 release 的资产自动同步到镜像仓，不再依赖 dist-free 的中心链路。
# 触发：release 发布 / 手动 / 每 6 小时对账（上传幂等，重复跑无副作用）。
#
# 格式与 meta-models 对齐：release 里有什么（本体 + `.sha256` 旁挂 + SHA256SUMS.txt），
# 镜像里就有什么，一个不多一个不少；同名只允许一行。

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  publish:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEA_URL: https://atelier.hurcaguari.top
      CNB_TOKEN: ${{ secrets.ATELIER_CNB_TOKEN }}
      CNB_API: https://api.cnb.cool
      CNB_REPO: Atelier-2026/Kernel
      GITLAB_TOKEN: ${{ secrets.ATELIER_GITLAB_TOKEN }}
      GITLAB_PROJECT: "88933579"
      GITLAB_PACKAGE: "atelier-kernel"
    steps:
      - name: Resolve latest release
        id: rel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "token $($env:GITEA_TOKEN)" }
          $all = @(); foreach ($x in (Invoke-RestMethod -Uri "$env:GITEA_URL/api/v1/repos/$env:GITHUB_REPOSITORY/releases?limit=1" -Headers $h -TimeoutSec 60)) { $all += $x }
          $first = $all | Select-Object -First 1
          if (-not $first) { throw "no release in this repo yet" }
          $tag = $first.tag_name
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT
          "release ${tag}: $(@($first.assets).Count) asset(s)"

          $dir = Join-Path $env:RUNNER_TEMP 'rel'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $list = @()
          # 旁挂一起搬：镜像里缺 `.sha256` 就等于格式不齐，校验方只能靠清单。
          foreach ($a in @($first.assets)) {
            $local = Join-Path $dir $a.name
            Invoke-WebRequest -Uri $a.browser_download_url -Headers $h -OutFile $local -TimeoutSec 1800
            $list += [pscustomobject]@{ name = $a.name; path = $local; size = (Get-Item $local).Length }
          }
          if (-not $list.Count) { throw "release has no downloadable assets" }
          $list | ConvertTo-Json -Compress | Set-Content (Join-Path $dir 'assets.json') -Encoding UTF8
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Mirror to CNB
        if: env.CNB_REPO != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CNB_TOKEN) { "no cnb token, skip"; exit 0 }
          $auth = @{ Authorization = "Bearer $($env:CNB_TOKEN)"; Accept = 'application/vnd.cnb.api+json' }
          $tag = "${{ steps.rel.outputs.tag }}"
          $list = Get-Content (Join-Path "${{ steps.rel.outputs.dir }}" 'assets.json') -Raw | ConvertFrom-Json

          # 显式展平：Invoke-RestMethod 的结果被 PSObject 包着，@() 不会拆开；
          # 不拆的话 `Where tag` 会整组命中，relId 变成 "id1 id2" → 后面全 404。
          $rels = @(); foreach ($x in (Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases" -Headers $auth -TimeoutSec 60)) { $rels += $x }
          $hit = @($rels | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1
          if ($hit) {
            $relId = $hit.id
            "cnb release exists: $relId"
          } else {
            $repoName = $env:GITHUB_REPOSITORY.Split('/')[-1]
            $b = @{ tag_name = $tag; name = "$repoName $tag"; description = 'mirror of the Gitea release'; draft = $false; prerelease = $false; target_commitish = 'master' } | ConvertTo-Json -Compress
            $relId = (Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases" -Method Post -Headers $auth -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($b)) -TimeoutSec 60).id
            "cnb release created: $relId"
          }

          $detail = Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases/$relId" -Headers $auth -TimeoutSec 60
          $existing = @{}
          foreach ($x in @($detail.assets)) { $existing[$x.name] = $x.size }
          "cnb has $($existing.Count) asset(s)"

          $fail = @(); $ok = 0; $skipped = 0
          foreach ($a in $list) {
            try {
              if ($existing.ContainsKey($a.name) -and $existing[$a.name] -eq $a.size) { "  = $($a.name)"; $skipped++; continue }
              $body = @{ asset_name = $a.name; size = $a.size; overwrite = $true; ttl = 0 } | ConvertTo-Json -Compress
              $u = Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases/$relId/asset-upload-url" -Method Post -Headers $auth -ContentType 'application/json' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 60
              $put = Invoke-WebRequest -Uri $u.upload_url -Method Put -InFile $a.path -TimeoutSec 1800 -UseBasicParsing
              if ($put.StatusCode -lt 200 -or $put.StatusCode -ge 300) { throw "upload HTTP $($put.StatusCode)" }
              if ($u.verify_url) { try { Invoke-RestMethod -Uri $u.verify_url -Method Post -Headers $auth -TimeoutSec 60 | Out-Null } catch { } }
              "  + $($a.name)"
              $ok++
            } catch { $fail += "cnb $($a.name): $($_.Exception.Message)" }
          }
          if ($fail.Count) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          "cnb: pushed $ok, skipped $skipped"

      - name: Mirror to GitLab
        if: env.GITLAB_PROJECT != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITLAB_TOKEN) { "no gitlab token, skip"; exit 0 }
          $api = "https://gitlab.com/api/v4/projects/$($env:GITLAB_PROJECT)"
          $hdr = @{ 'PRIVATE-TOKEN' = $env:GITLAB_TOKEN }
          $ver = "${{ steps.rel.outputs.version }}"
          $list = Get-Content (Join-Path "${{ steps.rel.outputs.dir }}" 'assets.json') -Raw | ConvertFrom-Json

          # generic package 没有"改"，只有"加一行"。所以每条资产先删同名旧行再 PUT，
          # 这样重复跑不会堆出多行（以前就是这么把同一个权重堆成三份的）。
          $pk = @(); foreach ($x in (Invoke-RestMethod -Uri "$api/packages?package_name=$($env:GITLAB_PACKAGE)&per_page=100" -Headers $hdr -TimeoutSec 60)) { $pk += $x }
          $pkg = $pk | Where-Object { $_.version -eq $ver } | Select-Object -First 1
          $rows = @()
          if ($pkg) { foreach ($x in (Invoke-RestMethod -Uri "$api/packages/$($pkg.id)/package_files?per_page=100" -Headers $hdr -TimeoutSec 60)) { $rows += $x } }

          $fail = @(); $pushed = 0; $skipped = 0
          foreach ($a in $list) {
            $mine = @($rows | Where-Object { $_.file_name -eq $a.name })
            $sha = (Get-FileHash $a.path -Algorithm SHA256).Hash.ToLower()
            if ($mine.Count -eq 1 -and $mine[0].file_sha256 -eq $sha) { "  = $($a.name)"; $skipped++; continue }
            foreach ($row in $mine) {
              try { Invoke-RestMethod -Uri "$api/packages/$($pkg.id)/package_files/$($row.id)" -Method Delete -Headers $hdr -TimeoutSec 60 | Out-Null; "  - stale $($a.name) row $($row.id)" }
              catch { $fail += "delete $($row.id): $($_.Exception.Message)" }
            }
            $url = "$api/packages/generic/$($env:GITLAB_PACKAGE)/$ver/$([uri]::EscapeDataString($a.name))"
            $out = & curl.exe -sS --fail-with-body --max-time 1800 -X PUT -H "PRIVATE-TOKEN: $($env:GITLAB_TOKEN)" --upload-file $a.path $url 2>&1
            if ($LASTEXITCODE -ne 0) { $fail += "upload $($a.name): $out"; continue }
            "  + $($a.name)"
            $pushed++
          }
          if ($fail.Count) { $fail | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          "gitlab: pushed $pushed, skipped $skipped"

      - name: Verify mirrors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ steps.rel.outputs.tag }}"
          $list = Get-Content (Join-Path "${{ steps.rel.outputs.dir }}" 'assets.json') -Raw | ConvertFrom-Json
          $want = @($list | ForEach-Object { $_.name } | Sort-Object)
          $bad = 0

          if ($env.CNB_REPO) {
            $auth = @{ Authorization = "Bearer $($env:CNB_TOKEN)"; Accept = 'application/vnd.cnb.api+json' }
            $rels = @(); foreach ($x in (Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases" -Headers $auth -TimeoutSec 60)) { $rels += $x }
            $hit = @($rels | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1
            $detail = Invoke-RestMethod -Uri "$env:CNB_API/$($env:CNB_REPO)/-/releases/$($hit.id)" -Headers $auth -TimeoutSec 60
            $got = @($detail.assets | ForEach-Object { $_.name } | Sort-Object)
            if (($want -join '|') -ne ($got -join '|')) { Write-Host "::error::cnb 资产集合与 release 不一致`n  release: $($want -join ', ')`n  cnb    : $($got -join ', ')"; $bad++ }
            else { "cnb ok: $($got.Count) asset(s)" }
          }

          if ($env.GITLAB_PROJECT) {
            $api = "https://gitlab.com/api/v4/projects/$($env:GITLAB_PROJECT)"
            $hdr = @{ 'PRIVATE-TOKEN' = $env:GITLAB_TOKEN }
            $ver = "${{ steps.rel.outputs.version }}"
            $pk = @(); foreach ($x in (Invoke-RestMethod -Uri "$api/packages?package_name=$($env:GITLAB_PACKAGE)&per_page=100" -Headers $hdr -TimeoutSec 60)) { $pk += $x }
            $pkg = $pk | Where-Object { $_.version -eq $ver } | Select-Object -First 1
            $rows = @(); foreach ($x in (Invoke-RestMethod -Uri "$api/packages/$($pkg.id)/package_files?per_page=100" -Headers $hdr -TimeoutSec 60)) { $rows += $x }
            $dupes = @($rows | Group-Object file_name | Where-Object { $_.Count -gt 1 })
            if ($dupes.Count) { Write-Host "::error::gitlab 有重复文件: " + (($dupes | ForEach-Object { "$($_.Name)x$($_.Count)" }) -join ', '); $bad++ }
            $got = @($rows | ForEach-Object { $_.file_name } | Sort-Object)
            if (($want -join '|') -ne ($got -join '|')) { Write-Host "::error::gitlab 资产集合与 release 不一致`n  release: $($want -join ', ')`n  gitlab : $($got -join ', ')"; $bad++ }
            else { "gitlab ok: $($got.Count) asset(s), no duplicates" }
          }

          if ($bad) { exit 1 }
          "mirrors aligned with release ${tag}"
