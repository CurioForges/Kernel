name: Kernel release

# master 有提交就自动发版：自动 patch 递增 → 构建 → 打 tag → 发 release → 按 topic 通知全部域仓库。
# 开发在开发分支做，合并到 master 即代表"这一批要发布"。

on:
  push:
    branches: [master]
    paths-ignore:
      - '.gitea/**'
      - 'ci/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: 版本递增类型
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-x64
    timeout-minutes: 60
    env:
      GITEA_TOKEN: ${{ secrets.ATELIER_PAT }}
      GITEA_URL: https://atelier.hurcaguari.top
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ATELIER_PAT }}
          fetch-depth: 0

      - name: Resolve next version and notes
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bump = if ('${{ inputs.bump }}') { '${{ inputs.bump }}' } else { 'patch' }
          $tags = @(git tag --list 'v*' --sort=-v:refname)
          $latest = if ($tags.Count -gt 0) { $tags[0] } else { 'v0.0.0' }
          $core = $latest.TrimStart('v')
          $parts = $core.Split('.')
          $major = [int]$parts[0]; $minor = [int]$parts[1]; $patchN = [int]$parts[2]
          switch ($bump) {
            'major' { $major++; $minor = 0; $patchN = 0 }
            'minor' { $minor++; $patchN = 0 }
            default { $patchN++ }
          }
          $next = "v$major.$minor.$patchN"
          "prev=$latest"      >> $env:GITHUB_OUTPUT
          "tag=$next"         >> $env:GITHUB_OUTPUT
          "version=$major.$minor.$patchN" >> $env:GITHUB_ENV
          "TAG=$next"         >> $env:GITHUB_ENV
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha"          >> $env:GITHUB_OUTPUT
          $subject = ("$(git log -1 --pretty=%s)").Trim()
          $body = ("$(git log -1 --pretty=%b)").Trim()
          $changes = if ($tags.Count -gt 0) { (@(git log --pretty='- %s (%h)' "$latest..HEAD") -join "`n").Trim() } else { '' }
          $notes = @($subject, '', $body, '', '### Changes since ' + $latest, $changes) -join "`n"
          $notes = $notes.Trim()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $notes, (New-Object System.Text.UTF8Encoding($false)))
          "release: $latest -> $next  (bump=$bump)"
          "subject: $subject"

      - name: Bump package versions
        shell: pwsh
        run: |
          $v = $env:version
          $cargo = 'Cargo.toml'
          $t = Get-Content $cargo -Raw
          $t = [regex]::Replace($t, '(?m)^version = "[^"]+"', "version = `"$v`"", 1)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $cargo), $t, (New-Object System.Text.UTF8Encoding($false)))
          $pj = 'sdk/nodejs/package.json'
          if (Test-Path $pj) {
            $j = Get-Content $pj -Raw | ConvertFrom-Json
            $j.version = $v
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) $pj), ($j | ConvertTo-Json -Depth 20), (New-Object System.Text.UTF8Encoding($false)))
          }
          Get-ChildItem sdk/python -Recurse -Filter '__init__.py' -ErrorAction SilentlyContinue |
            Where-Object { (Get-Content $_.FullName -Raw) -match '__version__' } |
            ForEach-Object {
              $x = Get-Content $_.FullName -Raw
              $x = [regex]::Replace($x, '(__version__\s*=\s*)"[^"]+"', ('$1"' + $v + '"'))
              [System.IO.File]::WriteAllText($_.FullName, $x, (New-Object System.Text.UTF8Encoding($false)))
            }
          git config user.name 'Atelier Release'
          git config user.email 'release@atelier.local'
          git add -A Cargo.toml sdk
          git commit -q -m "release: v$v"
          if ($LASTEXITCODE -eq 0) {
            git push origin HEAD:master 2>$null
            if ($LASTEXITCODE -ne 0) { "WARN: 版本提交未推送（非快进），构建继续" }
          }
          "versions bumped to $v"

      - name: Build kernel binary
        shell: pwsh
        run: |
          cargo build --release
          if (-not (Test-Path 'target\release\atelier-kernel.exe')) { throw "kernel binary missing" }
          "built $([math]::Round((Get-Item 'target\release\atelier-kernel.exe').Length/1MB,1)) MB"

      - name: Build SDK packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\sdk | Out-Null
          & python sdk\python\build_wheel.py dist\sdk
          if ($LASTEXITCODE -ne 0) { throw "python wheel build failed" }
          Push-Location sdk\nodejs
          try { & npm pack --pack-destination ..\..\dist\sdk } finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed" }
          Get-ChildItem dist\sdk | ForEach-Object { "  $($_.Name)" }

      - name: Assemble runtime bundle
        shell: pwsh
        run: |
          $label = 'windows-x86_64'
          $rt = "dist\kernel-runtime-$label"
          New-Item -ItemType Directory -Force "$rt\sdk\python","$rt\sdk\nodejs" | Out-Null
          Copy-Item target\release\atelier-kernel.exe $rt -Force
          Copy-Item kernel_boot.json "$rt\kernel_boot.template.json" -Force
          Copy-Item README.md $rt -Force
          Copy-Item docs $rt -Recurse -Force
          Copy-Item sdk\python\README.md "$rt\sdk\python\README.md" -Force
          Copy-Item sdk\nodejs\README.md "$rt\sdk\nodejs\README.md" -Force
          Copy-Item dist\sdk\* "$rt\sdk" -Force
          $zip = "dist\Atelier-Kernel-runtime-$label-$env:TAG.zip"
          Compress-Archive -Path "$rt\*" -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256" -Encoding ASCII
          Get-ChildItem dist\sdk\*.whl | ForEach-Object {
            $hh = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hh  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ASCII
          }
          "runtime: $([math]::Round((Get-Item $zip).Length/1MB,1)) MB"

      - name: Create tag and release
        shell: pwsh
        run: |
          $headers = @{ Authorization = "token $($env:GITEA_TOKEN)" }
          $api = "$env:GITEA_URL/api/v1/repos/Atelier/core-kernel"
          $tagBody = @{ tag_name = $env:TAG; target = "${{ steps.ver.outputs.sha }}"; message = "release $env:TAG" } | ConvertTo-Json -Compress
          try { Invoke-RestMethod -Uri "$api/tags" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($tagBody)) -TimeoutSec 60 | Out-Null; "tag $env:TAG created" }
          catch { "tag exists or failed: $($_.Exception.Message)" }
          $notes = Get-Content release-notes.md -Raw
          $relBody = @{ tag_name = $env:TAG; name = "Atelier Kernel $env:TAG"; body = $notes; draft = $false; prerelease = $false } | ConvertTo-Json -Compress
          $rel = Invoke-RestMethod -Uri "$api/releases" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($relBody)) -TimeoutSec 60
          "release id=$($rel.id) tag=$($rel.tag_name)"
          $assets = @()
          $assets += Get-ChildItem dist\Atelier-Kernel-runtime-*.zip | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem dist\Atelier-Kernel-runtime-*.zip.sha256 | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem dist\sdk\*.whl | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem dist\sdk\*.whl.sha256 | Select-Object -ExpandProperty FullName
          $assets += Get-ChildItem dist\sdk\*.tgz | Select-Object -ExpandProperty FullName
          foreach ($a in $assets) {
            $name = Split-Path -Leaf $a
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $a).Path)
            $boundary = [guid]::NewGuid().ToString()
            $head = "--$boundary`r`nContent-Disposition: form-data; name=`"attachment`"; filename=`"$name`"`r`nContent-Type: application/octet-stream`r`n`r`n"
            $tail = "`r`n--$boundary--`r`n"
            $ms = New-Object System.IO.MemoryStream
            $hb = [Text.Encoding]::UTF8.GetBytes($head); $tb = [Text.Encoding]::UTF8.GetBytes($tail)
            $ms.Write($hb,0,$hb.Length); $ms.Write($bytes,0,$bytes.Length); $ms.Write($tb,0,$tb.Length)
            Invoke-RestMethod -Uri "$api/releases/$($rel.id)/assets?name=$name" -Method Post -Headers $headers -ContentType "multipart/form-data; boundary=$boundary" -Body $ms.ToArray() -TimeoutSec 900 | Out-Null
            "  ↑ $name"
          }

      - name: Notify all domain repos
        shell: pwsh
        run: |
          $headers = @{ Authorization = "token $($env:GITEA_TOKEN)" }
          $found = Invoke-RestMethod -Uri "$env:GITEA_URL/api/v1/repos/search?q=atelier-domain&topic=true&limit=50" -Headers $headers -TimeoutSec 30
          $ok = 0; $skip = 0
          foreach ($repo in $found.data) {
            $body = @{ ref = 'master'; inputs = @{ kernel_version = $env:version; sdk_version = $env:version } } | ConvertTo-Json -Compress
            try {
              Invoke-RestMethod -Uri "$env:GITEA_URL/api/v1/repos/$($repo.full_name)/actions/workflows/artifact.yml/dispatches" -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 30 | Out-Null
              "  dispatched $($repo.name)"; $ok++
            } catch { "  skip $($repo.name)"; $skip++ }
          }
          "domains: dispatched=$ok skipped=$skip"
